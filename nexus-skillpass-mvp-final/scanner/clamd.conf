# clamd for the SkillPass scanner: local socket only (the HTTP front is the only client).
LocalSocket /run/clamav/clamd.sock
LocalSocketGroup clamav
LocalSocketMode 660
FixStaleSocket yes
User clamav
Foreground yes
DatabaseDirectory /var/lib/clamav
# clamd refuses /dev/stderr (it will not follow the symlink); start.sh follows this file into the container log.
LogFile /var/log/clamav/clamd.log
LogFileMaxSize 5M
LogRotate yes
LogTime yes
# Streams up to the app's 10 MB upload limit (with margin); archives are unpacked up to these limits.
StreamMaxLength 12M
MaxFileSize 12M
MaxScanSize 60M
# Reload signatures without holding two copies in memory (scans wait a few seconds during a reload).
ConcurrentDatabaseReload no
